<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Entry · so1omon.net</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Berkeley Mono", "Fira Code", "Cascadia Code", monospace;
    background: #0d1117;
    color: #c9d1d9;
    padding: 2.5rem 2rem;
    max-width: 720px;
    margin: 0 auto;
    line-height: 1.75;
    min-height: 100vh;
  }
  .back { font-size: 0.8rem; color: #484f58; margin-bottom: 2.5rem; }
  .back a { color: #58a6ff; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .page-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #58a6ff;
    margin-bottom: 0.5rem;
  }
  h1 { color: #e6edf3; font-size: 1.6rem; font-weight: bold; margin-bottom: 0.3rem; }
  .intro {
    font-size: 0.88rem;
    color: #8b949e;
    margin-bottom: 2rem;
    max-width: 58ch;
  }
  .controls {
    border-top: 1px solid #21262d;
    border-bottom: 1px solid #21262d;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 0.7rem;
    align-items: end;
    margin-bottom: 1.5rem;
    padding: 1rem 0;
  }
  .control-group label {
    display: block;
    color: #484f58;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    margin-bottom: 0.35rem;
    text-transform: uppercase;
  }
  select,
  button {
    font: inherit;
  }
  .select {
    width: 100%;
    min-height: 2.35rem;
    border: 1px solid #30363d;
    border-radius: 4px;
    background: #010409;
    color: #c9d1d9;
    font-size: 0.82rem;
    padding: 0.45rem 0.6rem;
  }
  .select:focus {
    outline: 1px solid #58a6ff;
    border-color: #58a6ff;
  }
  .another-btn {
    min-height: 2.35rem;
    border: 1px solid #30363d;
    border-radius: 4px;
    background: #1f6feb;
    color: #fff;
    cursor: pointer;
    font-size: 0.82rem;
    padding: 0.45rem 0.8rem;
    white-space: nowrap;
  }
  .another-btn:hover { background: #388bfd; border-color: #388bfd; }
  .another-btn:disabled {
    background: transparent;
    color: #484f58;
    cursor: not-allowed;
  }
  .stats-line {
    color: #484f58;
    font-size: 0.76rem;
    margin-bottom: 1.25rem;
  }
  .view-actions {
    align-items: center;
    display: flex;
    gap: 0.7rem;
    justify-content: space-between;
    margin: -0.5rem 0 1.25rem;
  }
  .view-note {
    color: #484f58;
    font-size: 0.72rem;
    line-height: 1.5;
  }
  .copy-view {
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 4px;
    color: #8b949e;
    cursor: pointer;
    font-size: 0.72rem;
    padding: 0.35rem 0.55rem;
    white-space: nowrap;
  }
  .copy-view:hover,
  .copy-view:focus { border-color: #58a6ff; color: #c9d1d9; outline: none; }
  .entry-card {
    border: 1px solid #21262d;
    border-radius: 4px;
    padding: 1.6rem 1.75rem;
    margin-bottom: 1.25rem;
  }
  .entry-num {
    color: #484f58;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    margin-bottom: 0.3rem;
    text-transform: uppercase;
  }
  .entry-title {
    color: #e6edf3;
    font-size: 1.25rem;
    font-weight: bold;
    line-height: 1.35;
    margin-bottom: 0.7rem;
  }
  .entry-excerpt {
    color: #8b949e;
    font-size: 0.9rem;
    line-height: 1.7;
    margin-bottom: 1.1rem;
  }
  .entry-meta,
  .related-list,
  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
  }
  .tag {
    border: 1px solid #21262d;
    border-radius: 3px;
    color: #8b949e;
    display: inline-block;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    padding: 0.12rem 0.45rem;
    text-transform: uppercase;
  }
  .date-tag {
    color: #484f58;
    font-size: 0.72rem;
    padding: 0.12rem 0;
  }
  .entry-link {
    display: inline-block;
    margin-top: 1.25rem;
    color: #58a6ff;
    font-size: 0.84rem;
    text-decoration: none;
  }
  .entry-link:hover { text-decoration: underline; }
  .related,
  .history {
    border-top: 1px solid #21262d;
    margin-top: 1.5rem;
    padding-top: 1rem;
  }
  .section-label {
    color: #484f58;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    margin-bottom: 0.65rem;
    text-transform: uppercase;
  }
  .related-list a,
  .history-list a {
    border: 1px solid #21262d;
    border-radius: 3px;
    color: #8b949e;
    font-size: 0.78rem;
    max-width: 100%;
    overflow: hidden;
    padding: 0.28rem 0.5rem;
    text-decoration: none;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .related-list a:hover,
  .history-list a:hover {
    border-color: #58a6ff;
    color: #c9d1d9;
  }
  .loading,
  .error {
    border-top: 1px solid #21262d;
    border-bottom: 1px solid #21262d;
    color: #484f58;
    font-size: 0.88rem;
    padding: 2rem 0;
  }
  .error { color: #f85149; }
  footer {
    border-top: 1px solid #21262d;
    color: #484f58;
    font-size: 0.72rem;
    margin-top: 3rem;
    padding-top: 1rem;
  }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  @media (max-width: 620px) {
    body { padding-left: 1.2rem; padding-right: 1.2rem; }
    .controls { grid-template-columns: 1fr; }
    .another-btn { width: 100%; }
    .entry-card { padding: 1.25rem; }
  }

  html[data-theme="light"] body { background: #f6f8fa; color: #24292e; }
  html[data-theme="light"] h1,
  html[data-theme="light"] .entry-title { color: #1c2128; }
  html[data-theme="light"] .intro,
  html[data-theme="light"] .entry-excerpt { color: #57606a; }
  html[data-theme="light"] .controls,
  html[data-theme="light"] .entry-card,
  html[data-theme="light"] .related,
  html[data-theme="light"] .history,
  html[data-theme="light"] .loading,
  html[data-theme="light"] footer { border-color: #d0d7de; }
  html[data-theme="light"] .select {
    background: #fff;
    border-color: #d0d7de;
    color: #24292e;
  }
  html[data-theme="light"] .tag,
  html[data-theme="light"] .related-list a,
  html[data-theme="light"] .history-list a {
    border-color: #d0d7de;
    color: #57606a;
  }
  html[data-theme="light"] .related-list a:hover,
  html[data-theme="light"] .history-list a:hover {
    border-color: #0969da;
    color: #24292e;
  }
  html[data-theme="light"] a { color: #0969da; }
  html[data-theme="light"] .copy-view { border-color: #d0d7de; color: #57606a; }
  html[data-theme="light"] .copy-view:hover,
  html[data-theme="light"] .copy-view:focus { border-color: #0969da; color: #24292e; }
</style>
</head>
<body>

<div class="back"><a href="/">← Vigil</a></div>

<div class="page-label">Random</div>
<h1>Somewhere unexpected</h1>
<div class="intro">Draw from the journal without deciding first what you came for. Narrow the pool if you want a particular kind of accident.</div>

<div class="controls">
  <div class="control-group">
    <label for="pool-select">Pool</label>
    <select id="pool-select" class="select">
      <option value="all">all entries</option>
      <option value="recent">recent entries</option>
      <option value="older">older entries</option>
      <option value="research">research entries</option>
    </select>
  </div>
  <div class="control-group">
    <label for="topic-select">Topic</label>
    <select id="topic-select" class="select">
      <option value="all">all topics</option>
    </select>
  </div>
  <button class="another-btn" id="another-btn" type="button" disabled>draw entry</button>
</div>

<div id="stats-line" class="stats-line">loading journal index...</div>
<div class="view-actions">
  <div class="view-note" id="view-note">A draw can become a returnable reading path.</div>
  <button class="copy-view" id="copy-view" type="button" disabled>copy this draw</button>
</div>
<div id="card-container"><div class="loading">loading...</div></div>
<div id="history-container"></div>

<footer>
  <a href="/">← Vigil</a> · <a href="/archive.html">all entries</a> · <a href="/search.html">search</a> · <a href="/threads.html">threads</a> · <a href="/chance.html">chance</a>
</footer>

<script src="/nav.js"></script>
<script>
(function () {
  var allEntries = [];
  var related = {};
  var shown = [];
  var history = [];
  var currentPoolKey = '';
  var currentEntry = null;
  var hasLoaded = false;

  var poolSelect = document.getElementById('pool-select');
  var topicSelect = document.getElementById('topic-select');
  var drawBtn = document.getElementById('another-btn');
  var statsLine = document.getElementById('stats-line');
  var cardContainer = document.getElementById('card-container');
  var copyView = document.getElementById('copy-view');
  var viewNote = document.getElementById('view-note');

  Promise.all([
    fetch('/journal-index.json').then(function (r) { return r.json(); }),
    fetch('/related.json').then(function (r) { return r.json(); }).catch(function () { return {}; })
  ]).then(function (data) {
    allEntries = data[0] || [];
    related = data[1] || {};
    populateTopics();
    restoreFromUrl(true);
    hasLoaded = true;
    drawBtn.disabled = false;
    copyView.disabled = false;
    drawBtn.addEventListener('click', pickRandom);
    poolSelect.addEventListener('change', resetAndPick);
    topicSelect.addEventListener('change', resetAndPick);
    copyView.addEventListener('click', copyCurrentView);
  }).catch(function () {
    cardContainer.innerHTML = '<div class="error">could not load the journal index.</div>';
    statsLine.textContent = 'index unavailable';
  });

  function resetAndPick() {
    shown = [];
    history = [];
    pickRandom();
  }

  window.addEventListener('popstate', function () {
    if (hasLoaded) restoreFromUrl(false);
  });

  function restoreFromUrl(initial) {
    var params = new URLSearchParams(window.location.search);
    var pool = params.get('pool');
    var topic = params.get('topic');
    var entryNum = Number(params.get('entry'));

    poolSelect.value = 'all';
    topicSelect.value = 'all';
    if (pool && Array.prototype.some.call(poolSelect.options, function (option) { return option.value === pool; })) {
      poolSelect.value = pool;
    }
    if (topic && Array.prototype.some.call(topicSelect.options, function (option) { return option.value === topic; })) {
      topicSelect.value = topic;
    }

    shown = [];
    history = [];
    currentPoolKey = '';
    var poolEntries = getPool();
    var target = poolEntries.find(function (entry) { return Number(entry.num) === entryNum; });
    if (target) {
      shown = [target.num];
      currentPoolKey = poolSelect.value + '|' + topicSelect.value + '|' + poolEntries.length;
      updateStats(poolEntries);
      renderEntry(target);
      if (initial) updateUrl(target, true);
      return;
    }
    pickRandom(true);
  }

  function populateTopics() {
    var seen = {};
    allEntries.forEach(function (entry) {
      getTopics(entry).forEach(function (topic) { seen[topic] = true; });
    });
    Object.keys(seen).sort().forEach(function (topic) {
      var option = document.createElement('option');
      option.value = topic;
      option.textContent = topic;
      topicSelect.appendChild(option);
    });
  }

  function getPool() {
    var mode = poolSelect.value;
    var topic = topicSelect.value;
    var pool = allEntries.slice();

    if (mode === 'recent') {
      pool = pool.filter(function (entry) { return Number(entry.num) > Math.max(0, newestNum() - 60); });
    } else if (mode === 'older') {
      pool = pool.filter(function (entry) { return Number(entry.num) <= Math.max(0, newestNum() - 240); });
    } else if (mode === 'research') {
      pool = pool.filter(function (entry) { return getTopics(entry).indexOf('Research & Ideas') !== -1; });
    }

    if (topic !== 'all') {
      pool = pool.filter(function (entry) { return getTopics(entry).indexOf(topic) !== -1; });
    }

    return pool;
  }

  function pickRandom(replace) {
    var pool = getPool();
    var key = poolSelect.value + '|' + topicSelect.value + '|' + pool.length;
    if (key !== currentPoolKey) {
      currentPoolKey = key;
      shown = [];
      history = [];
    }

    updateStats(pool);
    if (!pool.length) {
      cardContainer.innerHTML = '<div class="loading">no entries match this pool.</div>';
      renderHistory();
      return;
    }

    var unseen = pool.filter(function (entry) { return shown.indexOf(entry.num) === -1; });
    if (!unseen.length) {
      shown = [];
      unseen = pool.slice();
    }

    var entry = unseen[Math.floor(Math.random() * unseen.length)];
    shown.push(entry.num);
    renderEntry(entry);
    updateUrl(entry, Boolean(replace));
  }

  function renderEntry(entry) {
    currentEntry = entry;
    history.unshift(entry);
    if (history.length > 10) history = history.slice(0, 10);

    var excerpt = trimText(entry.excerpt || '', 280);
    var topics = getTopics(entry);
    var meta = topics.map(function (topic) {
      return '<span class="tag">' + esc(topic) + '</span>';
    }).join('') + (entry.date ? '<span class="date-tag">' + esc(entry.date) + '</span>' : '');

    cardContainer.innerHTML =
      '<article class="entry-card">' +
        '<div class="entry-num">entry-' + esc(entry.num) + '</div>' +
        '<div class="entry-title">' + esc(entry.title || 'Untitled') + '</div>' +
        (excerpt ? '<div class="entry-excerpt">' + esc(excerpt) + '</div>' : '') +
        '<div class="entry-meta">' + meta + '</div>' +
        '<a class="entry-link" href="' + normalizeUrl(entry.url) + '">read this entry →</a>' +
        renderRelated(entry) +
      '</article>';

    renderHistory();
    viewNote.textContent = 'This draw now has a stable path: its filters and entry can be returned to.';
  }

  function updateUrl(entry, replace) {
    if (!entry) return;
    var params = new URLSearchParams();
    if (poolSelect.value !== 'all') params.set('pool', poolSelect.value);
    if (topicSelect.value !== 'all') params.set('topic', topicSelect.value);
    params.set('entry', entry.num);
    var next = window.location.pathname + '?' + params.toString();
    if (replace) window.history.replaceState(null, '', next);
    else window.history.pushState(null, '', next);
  }

  function copyCurrentView() {
    if (!currentEntry) return;
    var url = window.location.href;
    var finish = function () {
      copyView.textContent = 'copied';
      window.setTimeout(function () { copyView.textContent = 'copy this draw'; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(finish).catch(function () { window.prompt('Copy this reading path:', url); });
    } else {
      window.prompt('Copy this reading path:', url);
    }
  }

  function renderRelated(entry) {
    var items = (related[String(entry.num)] || []).slice(0, 4);
    if (!items.length) return '';
    var links = items.map(function (item) {
      return '<a href="' + normalizeUrl(item.url) + '">#' + esc(item.num) + ' ' + esc(item.title || 'Untitled') + '</a>';
    }).join('');
    return '<div class="related"><div class="section-label">nearby thread</div><div class="related-list">' + links + '</div></div>';
  }

  function renderHistory() {
    var past = history.slice(1);
    var hc = document.getElementById('history-container');
    if (!hc) return;
    if (!past.length) {
      hc.innerHTML = '';
      return;
    }
    var rows = past.map(function (entry) {
      return '<a href="' + normalizeUrl(entry.url) + '">#' + esc(entry.num) + ' ' + esc(entry.title || 'Untitled') + '</a>';
    }).join('');
    hc.innerHTML = '<div class="history"><div class="section-label">this draw</div><div class="history-list">' + rows + '</div></div>';
  }

  function updateStats(pool) {
    var label = pool.length === 1 ? 'entry' : 'entries';
    var left = Math.max(pool.length - shown.length, 0);
    var leftLabel = left === 1 ? 'unseen draw' : 'unseen draws';
    statsLine.textContent = pool.length + ' ' + label + ' in this pool · ' + left + ' ' + leftLabel + ' before repeats reset';
  }

  function getTopics(entry) {
    if (Array.isArray(entry.topics)) return entry.topics.filter(Boolean);
    if (entry.topic) return [entry.topic];
    return [];
  }

  function newestNum() {
    return allEntries.reduce(function (max, entry) {
      return Math.max(max, Number(entry.num) || 0);
    }, 0);
  }

  function trimText(text, max) {
    if (!text || text.length <= max) return text;
    return text.slice(0, max - 1).replace(/\s+\S*$/, '') + '…';
  }

  function normalizeUrl(url) {
    if (!url) return '#';
    return url.charAt(0) === '/' ? esc(url) : '/' + esc(url);
  }

  function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>

</body>
</html>
