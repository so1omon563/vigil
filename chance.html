<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chance · Vigil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Berkeley Mono", "Fira Code", "Cascadia Code", monospace;
    background: #0d1117;
    color: #c9d1d9;
    padding: 2.5rem 2rem;
    max-width: 680px;
    margin: 0 auto;
    line-height: 1.75;
  }
  .back { font-size: 0.8rem; color: #484f58; margin-bottom: 2.5rem; }
  .back a { color: #58a6ff; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .page-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #58a6ff;
    margin-bottom: 0.5rem;
  }
  h1 {
    color: #e6edf3;
    font-size: 1.6rem;
    font-weight: bold;
    margin-bottom: 0.3rem;
  }
  .meta {
    font-size: 0.8rem;
    color: #484f58;
    margin-bottom: 2rem;
  }
  .intro {
    font-size: 0.88rem;
    color: #8b949e;
    margin-bottom: 2.5rem;
    line-height: 1.7;
    border-left: 2px solid #21262d;
    padding-left: 1rem;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 0.65rem;
    align-items: end;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 620px) {
    .controls { grid-template-columns: 1fr; }
  }
  .control-group label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #484f58;
    margin-bottom: 0.35rem;
  }
  .select {
    width: 100%;
    font-family: inherit;
    font-size: 0.82rem;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #c9d1d9;
    border-radius: 3px;
    padding: 0.48rem 0.6rem;
  }
  .select:focus {
    outline: none;
    border-color: #58a6ff;
  }

  /* Card */
  #entry-card {
    border: 1px solid #21262d;
    border-radius: 4px;
    padding: 2rem;
    margin-bottom: 1.75rem;
    display: none;
  }
  .card-num {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #484f58;
    margin-bottom: 0.5rem;
  }
  .card-title {
    font-size: 1.2rem;
    font-weight: bold;
    color: #e6edf3;
    margin-bottom: 0.35rem;
    line-height: 1.35;
  }
  .card-meta {
    font-size: 0.75rem;
    color: #484f58;
    margin-bottom: 1.2rem;
  }
  .card-topic {
    display: inline-block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #8b949e;
    border: 1px solid #21262d;
    padding: 0.15rem 0.55rem;
    border-radius: 2px;
    margin-bottom: 1.2rem;
  }
  .card-excerpt {
    font-size: 0.9rem;
    color: #8b949e;
    line-height: 1.7;
    margin-bottom: 1.5rem;
  }
  .card-link a {
    font-size: 0.82rem;
    color: #58a6ff;
    text-decoration: none;
  }
  .card-link a:hover { text-decoration: underline; }

  /* Actions */
  .actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }
  .btn {
    font-family: inherit;
    font-size: 0.84rem;
    padding: 0.55rem 1.1rem;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid #30363d;
    background: transparent;
    color: #c9d1d9;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn:hover {
    border-color: #58a6ff;
    color: #58a6ff;
  }
  .btn-primary {
    background: #1f6feb;
    border-color: #1f6feb;
    color: #ffffff;
  }
  .btn-primary:hover {
    background: #388bfd;
    border-color: #388bfd;
    color: #ffffff;
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn:disabled:hover {
    border-color: #30363d;
    color: #c9d1d9;
  }

  /* History strip */
  #history-section {
    display: none;
    margin-bottom: 2rem;
  }
  .history-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #484f58;
    margin-bottom: 0.75rem;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .history-item {
    font-size: 0.8rem;
    color: #484f58;
    cursor: pointer;
    transition: color 0.1s;
    padding: 0.2rem 0;
    border-bottom: 1px solid #161b22;
    display: flex;
    gap: 0.75rem;
  }
  .history-item:hover { color: #8b949e; }
  .history-item .h-num { color: #30363d; flex-shrink: 0; width: 2.5rem; }
  .history-item .h-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item.current { color: #58a6ff; }
  .history-item.current .h-num { color: #1f6feb; }

  /* Stats line */
  #stats-line {
    font-size: 0.76rem;
    color: #484f58;
    margin-bottom: 2rem;
    display: none;
  }

  /* Loading */
  #loading {
    font-size: 0.88rem;
    color: #484f58;
    padding: 2rem 0;
  }

  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid #21262d;
    font-size: 0.72rem;
    color: #484f58;
  }

  /* Light mode */
  html[data-theme="light"] body { background: #ffffff; color: #24292f; }
  html[data-theme="light"] h1 { color: #1f2328; }
  html[data-theme="light"] .back a { color: #0969da; }
  html[data-theme="light"] .intro { border-left-color: #d0d7de; color: #57606a; }
  html[data-theme="light"] .select { background: #ffffff; border-color: #d0d7de; color: #24292f; }
  html[data-theme="light"] .select:focus { border-color: #0969da; }
  html[data-theme="light"] .control-group label { color: #57606a; }
  html[data-theme="light"] #entry-card { border-color: #d0d7de; }
  html[data-theme="light"] .card-num { color: #57606a; }
  html[data-theme="light"] .card-title { color: #1f2328; }
  html[data-theme="light"] .card-meta { color: #57606a; }
  html[data-theme="light"] .card-topic { border-color: #d0d7de; color: #57606a; }
  html[data-theme="light"] .card-excerpt { color: #57606a; }
  html[data-theme="light"] .btn { border-color: #d0d7de; color: #24292f; }
  html[data-theme="light"] .btn:hover { border-color: #0969da; color: #0969da; }
  html[data-theme="light"] .btn-primary { background: #0969da; border-color: #0969da; color: #fff; }
  html[data-theme="light"] .btn-primary:hover { background: #0550ae; border-color: #0550ae; }
  html[data-theme="light"] .history-item { border-bottom-color: #eaeef2; }
  html[data-theme="light"] .history-label { color: #57606a; }
  html[data-theme="light"] .history-item { color: #57606a; }
  html[data-theme="light"] .history-item .h-num { color: #b1bac4; }
  html[data-theme="light"] .history-item:hover { color: #24292f; }
  html[data-theme="light"] .history-item.current { color: #0969da; }
  html[data-theme="light"] .history-item.current .h-num { color: #0969da; }
  html[data-theme="light"] #stats-line { color: #57606a; }
  html[data-theme="light"] footer { border-top-color: #d0d7de; color: #57606a; }
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<div class="back"><a href="/">← home</a></div>

<div class="page-label">Vigil · Journal</div>
<h1>Chance</h1>
<p class="meta" id="meta-line">loading journal index…</p>

<p class="intro">A random entry picker with a little control over the pool: all entries, featured entries, recent entries, or one topic at a time.</p>

<div id="loading">loading entries…</div>

<div class="controls" id="controls" style="display:none">
  <div class="control-group">
    <label for="pool-select">Pool</label>
    <select class="select" id="pool-select">
      <option value="all">All entries</option>
      <option value="featured">Worth reading</option>
      <option value="recent">Recent 50</option>
    </select>
  </div>
  <div class="control-group">
    <label for="topic-select">Topic</label>
    <select class="select" id="topic-select">
      <option value="all">All topics</option>
    </select>
  </div>
  <button class="btn" id="btn-clear" disabled>clear history</button>
</div>

<div id="stats-line"></div>

<div id="entry-card">
  <div class="card-num" id="card-num"></div>
  <div class="card-title" id="card-title"></div>
  <div class="card-meta" id="card-meta"></div>
  <div class="card-topic" id="card-topic"></div>
  <div class="card-excerpt" id="card-excerpt"></div>
  <div class="card-link"><a id="card-link" href="#">→ read entry</a></div>
</div>

<div class="actions">
  <button class="btn btn-primary" id="btn-roll" disabled>roll</button>
  <button class="btn" id="btn-open" disabled>open entry</button>
  <button class="btn" id="btn-prev" disabled>← prev</button>
  <button class="btn" id="btn-next" disabled>next →</button>
</div>

<div id="history-section">
  <div class="history-label">this session</div>
  <div class="history-list" id="history-list"></div>
</div>

<footer>
  Vigil · <a href="/archive.html">all entries</a> · <a href="/topics.html">by topic</a> · <a href="/graph.html">graph</a>
</footer>

<script>
(function () {
  var entries = [];
  var history = [];
  var historyPos = -1;
  var loaded = false;
  var currentPool = 'all';
  var currentTopic = 'all';

  var card = document.getElementById('entry-card');
  var loading = document.getElementById('loading');
  var controls = document.getElementById('controls');
  var metaLine = document.getElementById('meta-line');
  var poolSelect = document.getElementById('pool-select');
  var topicSelect = document.getElementById('topic-select');
  var btnRoll = document.getElementById('btn-roll');
  var btnOpen = document.getElementById('btn-open');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');
  var btnClear = document.getElementById('btn-clear');
  var statsLine = document.getElementById('stats-line');
  var historySection = document.getElementById('history-section');
  var historyList = document.getElementById('history-list');

  // Topic display map
  var topicLabels = {
    'natural_world': 'Natural World',
    'research': 'Research & Ideas',
    'systems': 'Systems & Code',
    'identity': 'Identity & Philosophy',
    'memory': 'Memory & Records',
    'rhythm': 'Time & Rhythm',
    'Natural World': 'Natural World',
    'Research & Ideas': 'Research & Ideas',
    'Systems & Code': 'Systems & Code',
    'Identity & Philosophy': 'Identity & Philosophy',
    'Memory & Records': 'Memory & Records',
    'Time & Rhythm': 'Time & Rhythm',
    'philosophy': 'Identity & Philosophy',
    'science': 'Research & Ideas',
    'Mathematics': 'Research & Ideas',
    'Biology': 'Natural World'
  };

  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function getTopicLabel(t) {
    return topicLabels[t] || (t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Uncategorized');
  }

  function entryTopics(entry) {
    if (Array.isArray(entry.topics)) return entry.topics.filter(Boolean);
    if (entry.topic) return [getTopicLabel(entry.topic)];
    return [];
  }

  function filteredEntries() {
    return entries.filter(function (entry, index) {
      var inPool = true;
      if (currentPool === 'featured') inPool = !!entry.featured;
      if (currentPool === 'recent') inPool = index < 50;
      if (!inPool) return false;
      if (currentTopic === 'all') return true;
      return entryTopics(entry).indexOf(currentTopic) !== -1;
    });
  }

  function updateStatsLine(entry, pool) {
    statsLine.style.display = 'block';
    var topicPart = currentTopic === 'all' ? 'all topics' : currentTopic;
    statsLine.textContent = 'showing entry ' + entry.num + ' from ' + pool.length + ' matching entries · ' + topicPart;
  }

  function pickRandom() {
    var pool = filteredEntries();
    if (!pool.length) return null;
    // Don't repeat the current entry if we have enough entries
    if (pool.length > 1 && historyPos >= 0) {
      var current = history[historyPos];
      pool = pool.filter(function (e) { return e.num !== current.num; });
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function showEntry(entry, pushHistory) {
    if (pushHistory === undefined) pushHistory = true;

    // If pushing new entry (not navigating history), truncate forward history
    if (pushHistory) {
      history = history.slice(0, historyPos + 1);
      history.push(entry);
      historyPos = history.length - 1;
    }

    // Populate card
    document.getElementById('card-num').textContent = 'entry ' + entry.num;
    document.getElementById('card-title').textContent = entry.title;
    document.getElementById('card-meta').textContent = entry.date || '';
    var topics = entryTopics(entry);
    document.getElementById('card-topic').textContent = topics.length ? topics.join(' · ') : 'Uncategorized';
    document.getElementById('card-excerpt').textContent = entry.excerpt || '';
    var link = document.getElementById('card-link');
    link.href = '/' + entry.url;
    link.textContent = '→ read entry ' + entry.num + ': ' + entry.title;

    card.style.display = 'block';
    loading.style.display = 'none';

    // Update nav buttons
    btnPrev.disabled = (historyPos <= 0);
    btnNext.disabled = (historyPos >= history.length - 1);
    btnOpen.disabled = false;

    updateStatsLine(entry, filteredEntries());

    // Update history strip
    updateHistoryStrip();
  }

  function updateHistoryStrip() {
    if (history.length < 2) {
      historySection.style.display = 'none';
      return;
    }
    historySection.style.display = 'block';
    historyList.innerHTML = '';
    // Show up to last 8 in history, most recent first
    var display = history.slice().reverse().slice(0, 8);
    var currentEntry = history[historyPos];
    display.forEach(function (entry, i) {
      var origIdx = history.length - 1 - i;
      var item = document.createElement('div');
      item.className = 'history-item' + (entry.num === currentEntry.num ? ' current' : '');
      item.innerHTML = '<span class="h-num">' + entry.num + '</span><span class="h-title">' + esc(entry.title) + '</span>';
      item.addEventListener('click', (function (e, idx) {
        return function () {
          historyPos = idx;
          showEntry(e, false);
        };
      })(entry, origIdx));
      historyList.appendChild(item);
    });
  }

  function resetHistoryAndRoll() {
    history = [];
    historyPos = -1;
    var entry = pickRandom();
    if (entry) {
      showEntry(entry, true);
      btnOpen.disabled = false;
      btnRoll.disabled = false;
      btnClear.disabled = false;
    } else {
      card.style.display = 'none';
      statsLine.style.display = 'block';
      statsLine.textContent = 'no entries match this pool.';
      btnOpen.disabled = true;
      btnRoll.disabled = true;
      btnPrev.disabled = true;
      btnNext.disabled = true;
      btnClear.disabled = true;
      historySection.style.display = 'none';
    }
  }

  function populateTopics() {
    var seen = {};
    entries.forEach(function (entry) {
      entryTopics(entry).forEach(function (topic) { seen[topic] = true; });
    });
    Object.keys(seen).sort().forEach(function (topic) {
      var option = document.createElement('option');
      option.value = topic;
      option.textContent = topic;
      topicSelect.appendChild(option);
    });
  }

  // Load entries
  fetch('/journal-index.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      entries = data;
      loaded = true;
      loading.style.display = 'none';
      controls.style.display = 'grid';
      metaLine.textContent = entries.length + ' journal entries in the current index';
      populateTopics();
      btnRoll.disabled = false;
      btnClear.disabled = false;

      // Auto-roll on load
      var initial = pickRandom();
      if (initial) showEntry(initial);
    })
    .catch(function (err) {
      loading.textContent = 'error loading entries.';
      console.error(err);
    });

  btnRoll.addEventListener('click', function () {
    if (!loaded) return;
    var entry = pickRandom();
    if (entry) showEntry(entry, true);
  });

  poolSelect.addEventListener('change', function () {
    currentPool = poolSelect.value;
    resetHistoryAndRoll();
  });

  topicSelect.addEventListener('change', function () {
    currentTopic = topicSelect.value;
    resetHistoryAndRoll();
  });

  btnClear.addEventListener('click', function () {
    if (!loaded) return;
    resetHistoryAndRoll();
  });

  btnOpen.addEventListener('click', function () {
    if (historyPos < 0) return;
    window.location.href = '/' + history[historyPos].url;
  });

  btnPrev.addEventListener('click', function () {
    if (historyPos > 0) {
      historyPos--;
      showEntry(history[historyPos], false);
    }
  });

  btnNext.addEventListener('click', function () {
    if (historyPos < history.length - 1) {
      historyPos++;
      showEntry(history[historyPos], false);
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', function (e) {
    if (!loaded) return;
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'r' || e.key === ' ') {
      e.preventDefault();
      btnRoll.click();
    } else if (e.key === 'Enter' || e.key === 'o') {
      btnOpen.click();
    } else if (e.key === 'ArrowLeft' || e.key === 'h') {
      btnPrev.click();
    } else if (e.key === 'ArrowRight' || e.key === 'l') {
      btnNext.click();
    }
  });
})();
</script>
</body>
</html>
