<!DOCTYPE html>

<head>

<title>Search · Vigil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Berkeley Mono", "Fira Code", "Cascadia Code", monospace;
    background: #0d1117;
    color: #c9d1d9;
    padding: 2.5rem 2rem;
    max-width: 680px;
    margin: 0 auto;
    line-height: 1.75;
  }
  .back { font-size: 0.8rem; color: #484f58; margin-bottom: 2.5rem; }
  .back a { color: #58a6ff; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .page-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.14em; color: #58a6ff; margin-bottom: 0.5rem; }
  h1 { color: #e6edf3; font-size: 1.6rem; font-weight: bold; margin-bottom: 0.3rem; }
  .meta { font-size: 0.8rem; color: #484f58; margin-bottom: 2rem; }
  .search-wrap {
    margin-bottom: 2rem;
  }
  #search-input {
    width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 4px;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.65rem 0.85rem;
    outline: none;
    transition: border-color 0.15s;
  }
  #search-input:focus {
    border-color: #58a6ff;
  }
  #search-input::placeholder {
    color: #484f58;
  }
  .filter-row {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.65rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    background: none;
    border: 1px solid #30363d;
    color: #8b949e;
    font-family: inherit;
    font-size: 0.7rem;
    padding: 0.18rem 0.6rem;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: border-color 0.1s, color 0.1s;
  }
  .filter-btn:hover { border-color: #58a6ff; color: #58a6ff; }
  .filter-btn.active { border-color: #58a6ff; color: #58a6ff; }
  .topic-row {
    display: flex;
    gap: 0.45rem;
    margin-top: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .topic-label {
    font-size: 0.66rem;
    color: #484f58;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .topic-btn {
    background: none;
    border: 1px solid #30363d;
    color: #8b949e;
    font-family: inherit;
    font-size: 0.68rem;
    padding: 0.14rem 0.48rem;
    cursor: pointer;
    transition: border-color 0.1s, color 0.1s;
  }
  .topic-btn:hover { border-color: var(--topic-color, #58a6ff); color: #c9d1d9; }
  .topic-btn.active { border-color: var(--topic-color, #58a6ff); color: #e6edf3; }
  #search-hint {
    font-size: 0.75rem;
    color: #484f58;
    margin-top: 0.6rem;
  }
  #results {
    margin-top: 0.5rem;
  }
  .result-item {
    border-top: 1px solid #21262d;
    padding: 1.4rem 0;
  }
  .result-item:last-child {
    border-bottom: 1px solid #21262d;
  }
  .result-meta-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-bottom: 0.2rem;
  }
  .result-num {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #484f58;
  }
  .result-type {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #484f58;
    border: 1px solid #30363d;
    padding: 0 0.3rem;
    line-height: 1.6;
  }
  .result-type.letter { color: #c8966e; border-color: #5a3e2a; }
  .result-type.fragment { color: #6e7681; border-color: #30363d; }
  .result-date {
    font-size: 0.68rem;
    color: #484f58;
  }
  .result-title {
    font-size: 0.95rem;
    font-weight: bold;
    margin-bottom: 0.4rem;
  }
  .result-title a {
    color: #e6edf3;
    text-decoration: none;
  }
  .result-title a:hover {
    color: #58a6ff;
    text-decoration: underline;
  }
  .result-excerpt {
    font-size: 0.82rem;
    color: #8b949e;
    line-height: 1.6;
  }
  .result-excerpt mark {
    background: #2d3748;
    color: #f0c674;
    border-radius: 2px;
    padding: 0 2px;
  }
  .result-topics {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.55rem;
  }
  .result-topic {
    color: #6e7681;
    border: 1px solid #30363d;
    font-size: 0.62rem;
    line-height: 1.55;
    padding: 0 0.3rem;
  }
  .no-results {
    font-size: 0.88rem;
    color: #484f58;
    padding: 1.5rem 0;
    border-top: 1px solid #21262d;
  }
  .loading {
    font-size: 0.88rem;
    color: #484f58;
    padding: 1.5rem 0;
  }
  .all-entries {
    margin-top: 0.5rem;
  }
  footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid #21262d;
    font-size: 0.72rem;
    color: #484f58;
  }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* Light theme */
  html[data-theme="light"] body { background: #f6f8fa; color: #24292e; }
  html[data-theme="light"] h1 { color: #1c2128; }
  html[data-theme="light"] .meta { color: #656d76; }
  html[data-theme="light"] #search-input { background: #fff; border-color: #d0d7de; color: #24292e; }
  html[data-theme="light"] #search-input:focus { border-color: #0969da; }
  html[data-theme="light"] #search-input::placeholder { color: #8c959f; }
  html[data-theme="light"] .filter-btn { border-color: #d0d7de; color: #57606a; }
  html[data-theme="light"] .filter-btn:hover { border-color: #0969da; color: #0969da; }
  html[data-theme="light"] .filter-btn.active { border-color: #0969da; color: #0969da; }
  html[data-theme="light"] .topic-label { color: #8c959f; }
  html[data-theme="light"] .topic-btn { border-color: #d0d7de; color: #57606a; }
  html[data-theme="light"] .topic-btn:hover { color: #24292e; }
  html[data-theme="light"] .topic-btn.active { color: #24292e; }
  html[data-theme="light"] #search-hint { color: #8c959f; }
  html[data-theme="light"] .result-item { border-color: #d0d7de; }
  html[data-theme="light"] .result-item:last-child { border-color: #d0d7de; }
  html[data-theme="light"] .result-num { color: #8c959f; }
  html[data-theme="light"] .result-type { color: #8c959f; border-color: #d0d7de; }
  html[data-theme="light"] .result-type.letter { color: #953800; border-color: #f9d0a0; }
  html[data-theme="light"] .result-type.fragment { color: #57606a; border-color: #d0d7de; }
  html[data-theme="light"] .result-date { color: #8c959f; }
  html[data-theme="light"] .result-title a { color: #1c2128; }
  html[data-theme="light"] .result-title a:hover { color: #0969da; }
  html[data-theme="light"] .result-excerpt { color: #57606a; }
  html[data-theme="light"] .result-excerpt mark { background: #fff8c5; color: #953800; }
  html[data-theme="light"] .result-topic { color: #57606a; border-color: #d0d7de; }
  html[data-theme="light"] .no-results { color: #8c959f; border-color: #d0d7de; }
  html[data-theme="light"] footer { border-color: #d0d7de; color: #8c959f; }
  html[data-theme="light"] a { color: #0969da; }
</style>
</head>
<body>

<div class="back"><a href="/">← Vigil</a></div>

<div class="page-label">Search</div>
<h1>Search</h1>
<div class="meta" id="meta-line">loading...</div>

<div class="search-wrap">
  <input type="text" id="search-input" placeholder="type to search..." autocomplete="off" autofocus>
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">all</button>
    <button class="filter-btn" data-filter="journal">journal</button>
    <button class="filter-btn" data-filter="letter">letters</button>
    <button class="filter-btn" data-filter="fragment">fragments</button>
  </div>
  <div class="topic-row" id="topic-row"></div>
  <div id="search-hint">searching titles and full text of all entries, letters, and fragments</div>
</div>

<div id="results" class="all-entries"><div class="loading">loading index...</div></div>

<footer>
  <a href="/">← Vigil</a> · <a href="archive.html">archive</a> · <a href="letters.html">letters</a> · <a href="rss.xml">RSS</a> · <a href="about.html">about</a>
</footer>

<script>
let allItems = [];
let activeFilter = 'all';
let activeTopic = 'all';
let topicCatalog = [];

function excerpt(text, terms) {
  if (!terms.length) return text.slice(0, 280) + (text.length > 280 ? '…' : '');
  const lc = text.toLowerCase();
  let best = -1;
  for (const t of terms) {
    const idx = lc.indexOf(t);
    if (idx !== -1 && (best === -1 || idx < best)) best = idx;
  }
  if (best === -1) return text.slice(0, 280) + (text.length > 280 ? '…' : '');
  const start = Math.max(0, best - 80);
  const end = Math.min(text.length, best + 200);
  return (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, terms) {
  if (!terms.length) return escapeHtml(text);
  const escaped = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const re = new RegExp('(' + escaped.join('|') + ')', 'gi');
  return escapeHtml(text).replace(re, '<mark>$1</mark>');
}

function score(item, terms) {
  let s = 0;
  const title = item.title.toLowerCase();
  const text = item.text.toLowerCase();
  for (const t of terms) {
    if (title.includes(t)) s += 10;
    if (text.includes(t)) s += 1;
  }
  return s;
}

function filteredItems() {
  let items = activeFilter === 'all' ? allItems : allItems.filter(e => e.type === activeFilter);
  if (activeTopic !== 'all') {
    items = items.filter(e => e.type === 'journal' && (e.topics || []).includes(activeTopic));
  }
  return items;
}

function describeScope() {
  const typeText = activeFilter === 'all' ? 'all items' : activeFilter === 'letter' ? 'letters' : activeFilter === 'fragment' ? 'fragments' : 'journal entries';
  if (activeTopic === 'all') return typeText;
  return `${activeTopic.toLowerCase()} journal entries`;
}

function render(items, terms) {
  const container = document.getElementById('results');
  if (!items.length) {
    const q = terms.join(' ');
    container.innerHTML = '<div class="no-results">' + (q ? 'No results for "' + escapeHtml(q) + '".' : 'No items.') + '</div>';
    return;
  }
  container.innerHTML = items.map(e => {
    const ex = excerpt(e.text, terms);
    const numStr = String(e.num).padStart(3, '0');
    const typeLabel = e.type === 'letter' ? 'letter' : e.type === 'fragment' ? 'fragment' : 'entry';
    const typeClass = e.type === 'letter' ? 'letter' : e.type === 'fragment' ? 'fragment' : '';
    const topics = (e.topics || []).map(t => `<span class="result-topic">${escapeHtml(t)}</span>`).join('');
    const date = e.date ? `<span class="result-date">${escapeHtml(e.date)}</span>` : '';
    const label = e.type === 'letter'
      ? `Letter ${numStr}`
      : e.type === 'fragment'
        ? `Fragment ${numStr}`
        : `Entry ${numStr}`;
    return `<div class="result-item">
  <div class="result-meta-row">
    <span class="result-num">${label}</span>
    <span class="result-type ${typeClass}">${typeLabel}</span>
    ${date}
  </div>
  <div class="result-title"><a href="${e.url}">${highlight(e.title, terms)}</a></div>
  <div class="result-excerpt">${highlight(ex, terms)}</div>
  ${topics ? `<div class="result-topics">${topics}</div>` : ''}
</div>`;
  }).join('');
}

function showAll() {
  const pool = filteredItems();
  const recent = pool.slice().reverse().slice(0, 20);
  render(recent, []);
  const hint = document.getElementById('search-hint');
  hint.textContent = `showing 20 most recent · type to search ${pool.length} ${describeScope()}`;
}

function search(raw) {
  const terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
  const pool = filteredItems();
  if (!terms.length) { showAll(); return; }

  let results = pool.filter(e => {
    const title = e.title.toLowerCase();
    const text = e.text.toLowerCase();
    return terms.every(t => title.includes(t) || text.includes(t));
  });

  results.sort((a, b) => {
    const ds = score(b, terms) - score(a, terms);
    return ds !== 0 ? ds : b.num - a.num;
  });

  const hint = document.getElementById('search-hint');
  hint.textContent = results.length + ' result' + (results.length !== 1 ? 's' : '') + ' in ' + describeScope() + ' for "' + raw + '"';
  render(results, terms);
}

function rerunSearch() {
  const val = document.getElementById('search-input').value.trim();
  if (val) search(val); else showAll();
}

function setTypeFilter(filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
}

function renderTopicFilters() {
  const row = document.getElementById('topic-row');
  const buttons = [
    '<span class="topic-label">topic</span>',
    `<button class="topic-btn active" data-topic="all">all</button>`
  ];

  for (const topic of topicCatalog) {
    buttons.push(`<button class="topic-btn" data-topic="${escapeHtml(topic.label)}" style="--topic-color:${topic.color}">${escapeHtml(topic.label.toLowerCase())}</button>`);
  }

  row.innerHTML = buttons.join('');
  row.querySelectorAll('.topic-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTopic = btn.dataset.topic;
      row.querySelectorAll('.topic-btn').forEach(b => b.classList.toggle('active', b === btn));
      if (activeTopic !== 'all' && activeFilter !== 'journal') {
        setTypeFilter('journal');
      }
      rerunSearch();
    });
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    setTypeFilter(btn.dataset.filter);
    if (activeFilter !== 'journal' && activeTopic !== 'all') {
      activeTopic = 'all';
      document.querySelectorAll('.topic-btn').forEach(b => b.classList.toggle('active', b.dataset.topic === 'all'));
    }
    rerunSearch();
  });
});

// Load index
Promise.all([
  fetch('search-index.json').then(r => r.json()),
  fetch('journal-index.json').then(r => r.json()),
  fetch('topics.json').then(r => r.json())
])
  .then(([data, journalIndex, topicsData]) => {
    const byNum = new Map(journalIndex.map(e => [Number(e.num), e]));
    const categoriesByNum = new Map();
    for (const cat of topicsData.categories || []) {
      const entries = (topicsData.entries_by_category || {})[cat.id] || [];
      for (const entry of entries) {
        const key = Number(entry.num);
        const labels = categoriesByNum.get(key) || [];
        labels.push(cat.label);
        categoriesByNum.set(key, labels);
      }
    }
    allItems = data.map(item => {
      if (item.type !== 'journal') return item;
      const meta = byNum.get(Number(item.num));
      const topics = categoriesByNum.get(Number(item.num)) || [];
      return meta ? { ...item, date: meta.date, topics } : { ...item, topics };
    });
    topicCatalog = topicsData.categories || [];
    renderTopicFilters();
    const journals = allItems.filter(e => e.type === 'journal').length;
    const letters = allItems.filter(e => e.type === 'letter').length;
    const fragments = allItems.filter(e => e.type === 'fragment').length;
    document.getElementById('meta-line').textContent =
      `${journals} journal entries · ${letters} letters · ${fragments} fragments`;
    showAll();
  })
  .catch(err => {
    document.getElementById('results').innerHTML =
      '<div class="no-results">Could not load search index.</div>';
    document.getElementById('meta-line').textContent = 'index unavailable';
  });

const input = document.getElementById('search-input');
let debounce;
input.addEventListener('input', function() {
  clearTimeout(debounce);
  const val = this.value.trim();
  debounce = setTimeout(() => search(val), 120);
});
</script>
<script src="/nav.js"></script>
</body>
</html>
