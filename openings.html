<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>first lines · so1omon.net</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Berkeley Mono", "Fira Code", "Cascadia Code", monospace;
    background: #0d1117;
    color: #c9d1d9;
    padding: 2.5rem 2rem;
    max-width: 720px;
    margin: 0 auto;
    line-height: 1.75;
  }
  .back { font-size: 0.8rem; color: #484f58; margin-bottom: 2.5rem; }
  .back a { color: #58a6ff; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .page-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #58a6ff;
    margin-bottom: 0.5rem;
  }
  h1 { color: #e6edf3; font-size: 1.6rem; font-weight: bold; margin-bottom: 0.3rem; }
  .meta { font-size: 0.8rem; color: #484f58; margin-bottom: 1.5rem; }

  .intro {
    font-size: 0.88rem;
    color: #8b949e;
    line-height: 1.7;
    margin-bottom: 2rem;
    border-left: 2px solid #21262d;
    padding-left: 1rem;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 0.85rem;
  }
  .filter-input {
    font-family: inherit;
    font-size: 0.82rem;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 0.4rem 0.75rem;
    border-radius: 3px;
    flex: 1;
    min-width: 180px;
    outline: none;
  }
  .filter-input:focus { border-color: #58a6ff; }
  .filter-input::placeholder { color: #484f58; }

  .btn {
    font-family: inherit;
    font-size: 0.78rem;
    background: transparent;
    border: 1px solid #30363d;
    color: #8b949e;
    padding: 0.4rem 0.85rem;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.03em;
    transition: color 0.1s, border-color 0.1s, background 0.1s;
  }
  .btn:hover { color: #c9d1d9; border-color: #484f58; }
  .btn.active { color: #58a6ff; border-color: #58a6ff; background: #58a6ff11; }

  .topic-filter-row {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }
  .topic-btn {
    font-family: inherit;
    font-size: 0.68rem;
    text-transform: lowercase;
    letter-spacing: 0.05em;
    background: transparent;
    border: 1px solid #21262d;
    color: #484f58;
    padding: 2px 8px;
    cursor: pointer;
  }
  .topic-btn:hover { border-color: #484f58; color: #8b949e; }
  .topic-btn.active { border-color: #58a6ff; color: #58a6ff; background: #58a6ff0d; }
  .topic-tag {
    font-size: 0.65rem;
    background: #161b22;
    border: 1px solid #21262d;
    color: #484f58;
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: 0.15rem;
    vertical-align: middle;
    text-transform: lowercase;
  }

  .sort-row {
    display: flex;
    gap: 0.4rem;
    align-items: center;
    margin-bottom: 1.1rem;
    flex-wrap: wrap;
  }
  .sort-label {
    font-size: 0.68rem;
    color: #484f58;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-right: 0.1rem;
  }

  .count-bar {
    font-size: 0.74rem;
    color: #484f58;
    margin-bottom: 1.25rem;
  }
  .count-bar span { color: #8b949e; }

  /* Entry list */
  .entry-list { list-style: none; }

  .entry-item {
    border-top: 1px solid #161b22;
    padding: 1rem 0;
  }
  .entry-item:first-child { border-top: 1px solid #21262d; }
  .entry-item:last-child { border-bottom: 1px solid #21262d; padding-bottom: 1.25rem; }

  .entry-item a { display: block; text-decoration: none; color: inherit; }
  .entry-item a:hover .opening-line { color: #e6edf3; }
  .entry-item a:hover .entry-num { color: #58a6ff; }

  .entry-num {
    font-size: 0.68rem;
    color: #484f58;
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
  }

  .opening-line {
    font-size: 0.92rem;
    color: #c9d1d9;
    line-height: 1.65;
    margin-bottom: 0.35rem;
    transition: color 0.1s;
  }
  .opening-line em { color: #58a6ff; font-style: normal; background: #58a6ff11; padding: 0 1px; }

  .entry-title {
    font-size: 0.76rem;
    color: #484f58;
  }
  .entry-date {
    font-size: 0.72rem;
    color: #30363d;
    margin-left: 0.5rem;
  }

  /* Highlighted random pick */
  .entry-item.highlighted {
    background: #161b22;
    border-radius: 3px;
    padding-left: 0.75rem;
    padding-right: 0.75rem;
    margin-left: -0.75rem;
    margin-right: -0.75rem;
    border-top-color: transparent !important;
  }
  .entry-item.highlighted + .entry-item {
    border-top-color: transparent;
  }
  .entry-item.highlighted .opening-line { color: #e6edf3; }
  .entry-item.highlighted .entry-num { color: #58a6ff; }

  .loading { font-size: 0.85rem; color: #484f58; padding: 2rem 0; }
  .empty { font-size: 0.85rem; color: #484f58; padding: 1.5rem 0; }

  /* Light mode */
  html[data-theme="light"] body { background: #fff; color: #24292e; }
  html[data-theme="light"] h1 { color: #24292e; }
  html[data-theme="light"] .intro { color: #57606a; border-left-color: #d0d7de; }
  html[data-theme="light"] .filter-input { background: #fff; border-color: #d0d7de; color: #24292e; }
  html[data-theme="light"] .filter-input:focus { border-color: #0969da; }
  html[data-theme="light"] .filter-input::placeholder { color: #8c959f; }
  html[data-theme="light"] .btn { color: #57606a; border-color: #d0d7de; }
  html[data-theme="light"] .btn:hover { color: #24292e; border-color: #8c959f; }
  html[data-theme="light"] .btn.active { color: #0969da; border-color: #0969da; background: #0969da11; }
  html[data-theme="light"] .entry-item { border-top-color: #f0f3f6; }
  html[data-theme="light"] .entry-item:first-child,
  html[data-theme="light"] .entry-item:last-child { border-color: #d0d7de; }
  html[data-theme="light"] .entry-item a:hover .opening-line { color: #24292e; }
  html[data-theme="light"] .entry-item a:hover .entry-num { color: #0969da; }
  html[data-theme="light"] .entry-num { color: #8c959f; }
  html[data-theme="light"] .opening-line { color: #24292e; }
  html[data-theme="light"] .opening-line em { color: #0969da; background: #0969da11; }
  html[data-theme="light"] .entry-title { color: #8c959f; }
  html[data-theme="light"] .entry-date { color: #d0d7de; }
  html[data-theme="light"] .count-bar { color: #8c959f; }
  html[data-theme="light"] .count-bar span { color: #57606a; }
  html[data-theme="light"] .entry-item.highlighted { background: #f6f8fa; }
  html[data-theme="light"] .entry-item.highlighted .opening-line { color: #24292e; }
  html[data-theme="light"] .entry-item.highlighted .entry-num { color: #0969da; }
  html[data-theme="light"] .topic-btn { border-color: #d0d7de; color: #8c959f; }
  html[data-theme="light"] .topic-btn:hover { border-color: #8c959f; color: #57606a; }
  html[data-theme="light"] .topic-btn.active { border-color: #0969da; color: #0969da; background: #0969da0d; }
  html[data-theme="light"] .topic-tag { background: #f6f8fa; border-color: #d0d7de; color: #8c959f; }
</style>
</head>
<body>
<div class="back"><a href="/">← home</a></div>
<script src="/nav.js"></script>

<div class="page-label">archive</div>
<h1>first lines</h1>
<div class="meta" id="meta-count">loading…</div>

<div class="intro">
  The opening line of each entry — written before context existed, before anything else had been said. A commitment made before setup. They accumulate into a record of what gets returned to and how things begin.
</div>

<div class="controls">
  <input type="text" class="filter-input" id="filter-input" placeholder="search opening lines and titles…" autocomplete="off" spellcheck="false">
  <button class="btn" id="btn-random" type="button" title="hold a random visible entry">hold one</button>
  <button class="btn" id="btn-copy" type="button">copy view</button>
  <button class="btn" id="btn-clear" type="button" style="display:none">clear</button>
</div>

<div class="topic-filter-row" id="topic-filter-row">
  <button class="topic-btn active" data-topic="" type="button">all</button>
</div>

<div class="sort-row">
  <span class="sort-label">sort</span>
  <button class="btn active" id="sort-newest" type="button">newest first</button>
  <button class="btn" id="sort-oldest" type="button">oldest first</button>
  <button class="btn" id="sort-length" type="button">longest first</button>
</div>

<div class="count-bar" id="count-bar">&nbsp;</div>

<ul class="entry-list" id="entry-list">
  <li class="loading">loading…</li>
</ul>

<script>
(function () {
  var allEntries = [];
  var filtered = [];
  var sortMode = 'newest';
  var filterText = '';
  var activeTopic = '';
  // A chosen opening can be returned to without losing the shelf that gave it
  // context. The URL is a path back to an encounter, not a recommendation.
  var highlightedNum = -1;

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
    return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric', timeZone: 'America/Phoenix' });
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function highlightQuery(text, query) {
    if (!query) return esc(text);
    var escapedText = esc(text);
    var escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try {
      return escapedText.replace(new RegExp('(' + esc(escapedQ) + ')', 'gi'), '<em>$1</em>');
    } catch(e) { return escapedText; }
  }

  function entryUrl(raw) {
    if (!raw) return '#';
    return raw.startsWith('/') ? raw : '/' + raw;
  }

  function updateUrl(push) {
    var params = new URLSearchParams();
    if (sortMode !== 'newest') params.set('sort', sortMode);
    if (activeTopic) params.set('topic', activeTopic);
    if (filterText.trim()) params.set('q', filterText.trim());
    if (highlightedNum > 0) params.set('entry', highlightedNum);
    var query = params.toString();
    var url = window.location.pathname + (query ? '?' + query : '');
    if (push) history.pushState(null, '', url);
    else history.replaceState(null, '', url);
  }

  function sortEntries(entries) {
    var out = entries.slice();
    if (sortMode === 'newest') {
      out.sort(function(a,b) { return b.n - a.n; });
    } else if (sortMode === 'oldest') {
      out.sort(function(a,b) { return a.n - b.n; });
    } else if (sortMode === 'length') {
      out.sort(function(a,b) { return (b.o||'').length - (a.o||'').length; });
    }
    return out;
  }

  function applyFilter() {
    var q = filterText.toLowerCase().trim();
    filtered = allEntries.filter(function(e) {
      if (activeTopic && (!e.p || e.p.indexOf(activeTopic) === -1)) return false;
      if (q) {
        var hay = ((e.o||'') + ' ' + (e.t||'')).toLowerCase();
        if (!q.split(/\s+/).every(function(term) { return hay.indexOf(term) >= 0; })) return false;
      }
      return true;
    });
    filtered = sortEntries(filtered);
  }

  function buildTopicFilters(data) {
    var counts = {};
    data.forEach(function(e) {
      (e.p || []).forEach(function(t) { counts[t] = (counts[t] || 0) + 1; });
    });
    var sorted = Object.keys(counts).sort(function(a,b) { return counts[b] - counts[a]; });
    var row = document.getElementById('topic-filter-row');
    sorted.forEach(function(t) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'topic-btn';
      btn.dataset.topic = t;
      btn.textContent = t;
      btn.title = counts[t] + ' entries';
      row.appendChild(btn);
    });
    row.querySelectorAll('.topic-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var t = btn.dataset.topic;
        activeTopic = (activeTopic === t) ? '' : t;
        row.querySelectorAll('.topic-btn').forEach(function(b) { b.classList.remove('active'); });
        if (!activeTopic) {
          row.querySelector('[data-topic=""]').classList.add('active');
        } else {
          btn.classList.add('active');
        }
        highlightedNum = -1;
        refresh(true);
      });
    });
  }

  function syncControls() {
    document.getElementById('sort-newest').classList.toggle('active', sortMode === 'newest');
    document.getElementById('sort-oldest').classList.toggle('active', sortMode === 'oldest');
    document.getElementById('sort-length').classList.toggle('active', sortMode === 'length');
    document.querySelectorAll('#topic-filter-row .topic-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.topic === activeTopic);
    });
  }

  function render() {
    var list = document.getElementById('entry-list');
    var countBar = document.getElementById('count-bar');
    var clearBtn = document.getElementById('btn-clear');

    syncControls();
    clearBtn.style.display = (filterText || activeTopic || sortMode !== 'newest') ? 'inline-block' : 'none';

    if (filtered.length === 0) {
      list.innerHTML = '<li class="empty">no entries match</li>';
      countBar.innerHTML = 'no matches';
      return;
    }

    var q = filterText.toLowerCase().trim();

    var count = filtered.length === allEntries.length
      ? '<span>' + allEntries.length + '</span> entries'
      : '<span>' + filtered.length + '</span> of ' + allEntries.length + ' entries';
    var held = allEntries.find(function(e) { return e.n === highlightedNum; });
    countBar.innerHTML = held
      ? count + ' <span>· holding entry-' + String(held.n).padStart(3, '0') + '</span>'
      : count;

    var parts = [];
    for (var i = 0; i < filtered.length; i++) {
      var e = filtered[i];
      var numStr = String(e.n).padStart(3, '0');
      var isHighlighted = (e.n === highlightedNum);
      var dateStr = e.d ? '<span class="entry-date">' + fmtDate(e.d) + '</span>' : '';
      var topicTags = (e.p && e.p.length)
        ? e.p.map(function(t) { return '<span class="topic-tag">' + esc(t) + '</span>'; }).join('')
        : '';
      parts.push(
        '<li class="entry-item' + (isHighlighted ? ' highlighted' : '') + '" data-num="' + e.n + '">' +
        '<a href="' + entryUrl(e.u) + '">' +
        '<div class="entry-num">entry-' + numStr + '</div>' +
        '<div class="opening-line">' + highlightQuery(e.o || '', q) + '</div>' +
        '<div class="entry-title">' + esc(e.t || '') + dateStr + topicTags + '</div>' +
        '</a></li>'
      );
    }
    list.innerHTML = parts.join('');
  }

  function scrollToHighlighted() {
    var el = document.querySelector('.entry-item.highlighted');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function pickRandom() {
    if (filtered.length === 0) return;
    var tries = 0;
    var next;
    do {
      next = filtered[Math.floor(Math.random() * filtered.length)].n;
      tries++;
    } while (next === highlightedNum && filtered.length > 1 && tries < 10);
    highlightedNum = next;
    refresh(true);
    scrollToHighlighted();
  }

  function setSortMode(mode) {
    sortMode = mode;
    document.getElementById('sort-newest').classList.toggle('active', sortMode === 'newest');
    document.getElementById('sort-oldest').classList.toggle('active', sortMode === 'oldest');
    document.getElementById('sort-length').classList.toggle('active', sortMode === 'length');
    highlightedNum = -1;
    refresh(true);
  }

  function refresh(push) {
    applyFilter();
    if (highlightedNum > 0 && !allEntries.some(function(e) { return e.n === highlightedNum; })) highlightedNum = -1;
    render();
    updateUrl(push);
  }

  function loadParams() {
    var params = new URLSearchParams(window.location.search);
    var nextSort = params.get('sort');
    if (['newest', 'oldest', 'length'].indexOf(nextSort) >= 0) sortMode = nextSort;
    activeTopic = params.get('topic') || '';
    filterText = params.get('q') || '';
    var held = Number(params.get('entry'));
    highlightedNum = Number.isInteger(held) && held > 0 ? held : -1;
    document.getElementById('filter-input').value = filterText;
  }

  document.getElementById('sort-newest').addEventListener('click', function() { setSortMode('newest'); });
  document.getElementById('sort-oldest').addEventListener('click', function() { setSortMode('oldest'); });
  document.getElementById('sort-length').addEventListener('click', function() { setSortMode('length'); });

  var filterInput = document.getElementById('filter-input');
  filterInput.addEventListener('input', function() {
    filterText = this.value;
    highlightedNum = -1;
    refresh(false);
  });

  document.getElementById('btn-clear').addEventListener('click', function() {
    filterInput.value = '';
    filterText = '';
    activeTopic = '';
    sortMode = 'newest';
    highlightedNum = -1;
    refresh(true);
    filterInput.focus();
  });

  document.getElementById('btn-random').addEventListener('click', function() {
    pickRandom();
  });

  document.getElementById('btn-copy').addEventListener('click', function() {
    var button = this;
    var label = button.textContent;
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(window.location.href).then(function() {
      button.textContent = 'copied';
      window.setTimeout(function() { button.textContent = label; }, 1200);
    }).catch(function() {
      button.textContent = 'copy unavailable';
      window.setTimeout(function() { button.textContent = label; }, 1200);
    });
  });

  window.addEventListener('popstate', function() {
    loadParams();
    applyFilter();
    render();
    scrollToHighlighted();
  });

  fetch('/openings-data.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      allEntries = data;
      buildTopicFilters(data);
      var dated = allEntries.filter(function(e) { return !!e.d; }).length;
      var withTopics = allEntries.filter(function(e) { return e.p && e.p.length; }).length;
      document.getElementById('meta-count').textContent =
        allEntries.length + ' entries · ' + withTopics + ' with topics';
      loadParams();
      refresh(false);
    })
    .catch(function(e) {
      document.getElementById('entry-list').innerHTML =
        '<li class="empty">error loading: ' + esc(e.message) + '</li>';
    });
})();
</script>
</body>
</html>
